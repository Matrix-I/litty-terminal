[package]
name = "litty"
version = "0.12.0"
edition = "2024"
description = "Minimal GPU terminal: <50MB RAM, 0% idle CPU (Metal on macOS, Vulkan on Linux)"
license = "MIT"

[[bin]]
name = "litty"
path = "src/main.rs"

[dependencies]
# Grid bounds OSC streams before feeding VTE; std storage preserves complete
# supported payloads instead of the default 1,024-byte no_std truncation.
vte = { version = "0.13", default-features = false }
libc = "0.2"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
unicode-width = "0.2"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Wayland clipboard on the app's own connection (no wl-copy window flash on GNOME).
smithay-clipboard = "0.7"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
