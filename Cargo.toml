[package]
name = "litty"
version = "0.12.0"
edition = "2024"
description = "Minimal GPU terminal: <50MB RAM, 0% idle CPU (Metal on macOS, Vulkan on Linux)"
license = "MIT"

[[bin]]
name = "litty"
path = "src/main.rs"

[dependencies]
# Grid bounds OSC streams before feeding VTE; default `std` storage preserves
# complete supported payloads instead of the 1,024-byte `no_std` truncation.
vte = "0.15"
libc = "0.2"
parking_lot = "0.13"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
unicode-width = "0.2"
unicode-normalization = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Wayland clipboard on the app's own connection (no wl-copy window flash on GNOME).
smithay-clipboard = "0.7"
# Native Wayland windows (xdg-shell). Already in the tree through
# smithay-clipboard, whose default `dlopen` feature also loads libwayland at
# run time instead of linking it.
smithay-client-toolkit = { version = "0.20", default-features = false }
# Wayland keyboard layouts. libxkbcommon is opened at run time, as libX11
# and libwayland are, so the binary still links nothing but libc; sctk's own
# `xkbcommon` feature would link it.
xkbcommon-dl = "0.4"
# `custom-shader`: Vulkan takes SPIR-V only, so GLSL is compiled at load time
# (Metal compiles shader source itself).
naga = { version = "30", default-features = false, features = ["glsl-in", "spv-out"] }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16

# Clipboard and file drops share one wl_data_device on GNOME.
[patch.crates-io]
smithay-clipboard = { path = "patches/smithay-clipboard" }
