[package]
name = "litty"
version = "0.7.1"
edition = "2024"
description = "Minimal GPU terminal: <50MB RAM, 0% idle CPU (Metal on macOS, Vulkan on Linux)"

[[bin]]
name = "litty"
path = "src/main.rs"

[dependencies]
winit = "0.30"
fontdue = "0.9"
# Grid bounds OSC streams before feeding VTE; std storage preserves complete
# supported payloads instead of the default 1,024-byte no_std truncation.
vte = { version = "0.13", default-features = false }
libc = "0.2"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
pollster = "0.4"
memmap2 = "0.9"
unicode-width = "0.2"
unicode-normalization = "0.1"
regex = "1"
rustybuzz = "0.20.1"
png = "0.18.1"
miniz_oxide = "0.8"

# Phase 5: only compile the one GPU backend each platform needs (no DX12 / GL / WebGPU).
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
wgpu = { version = "24", default-features = false, features = ["wgsl", "glsl", "metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "24", default-features = false, features = ["wgsl", "glsl"] }
# Already built for winit's X11 backend; used for the Quick Terminal key grab.
x11rb = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16

[patch.crates-io]
block = { path = "patches/block" }
